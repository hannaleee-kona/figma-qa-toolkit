<title>체크레이어</title>
<meta name="description" content="네이밍, 색상 대비, CSS 변환을 한 화면에서 확인하는 디자인 QA 데모 도구" />
<style>

    --surface-2: #ece9e0;
    --ink: #191a16;
    --ink-soft: #63625a;
    --ink-faint: #a3a196;

    --accent: #e0461f;
    --accent-ink: #fff7f2;
    --ok: #1c7a4d;
    --ok-bg: #e4f3ea;
    --warn: #9a6a06;
    --warn-bg: #faf0d8;
    --fail: #b3311a;
    --fail-bg: #fbe7e2;
    --mono-bg: #191d16;
    --mono-ink: #d9f5c4;
    --mono-line: #33392c;
    --radius-sm: 3px;
    --radius-md: 6px;
    --shadow: 0 1px 0 rgba(25,26,22,0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14140f;
      --surface: #1c1c15;
      --surface-2: #24241b;
      --ink: #f1efe4;
      --ink-soft: #b3b0a0;
      --ink-faint: #6f6d5f;
      --line: #35342a;
      --accent: #ff6a3d;
      --accent-ink: #1c0800;
      --ok: #5fd699;
      --ok-bg: #123324;
      --warn: #e8c15a;
      --warn-bg: #362a0c;
      --fail: #ff8a75;
      --fail-bg: #3a140f;
      --mono-bg: #0d0f0a;
      --mono-ink: #c9f2ab;
      --mono-line: #2a2e20;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14140f;
    --surface: #1c1c15;
    --surface-2: #24241b;
    --ink: #f1efe4;
    --ink-soft: #b3b0a0;
    --ink-faint: #6f6d5f;
    --line: #35342a;
    --accent: #ff6a3d;
    --accent-ink: #1c0800;
    --ok: #5fd699;
    --ok-bg: #123324;
    --warn: #e8c15a;
    --warn-bg: #362a0c;
    --fail: #ff8a75;
    --fail-bg: #3a140f;
    --mono-bg: #0d0f0a;
    --mono-ink: #c9f2ab;
    --mono-line: #2a2e20;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans KR', -apple-system, sans-serif;
    padding-inline: 20px;
    padding-block: 28px 60px;
    max-width: 960px;
    margin: 0 auto;
  }
  h1, h2, h3, .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 18px;
    margin-bottom: 6px;
  }
  .brand { display: flex; flex-direction: column; gap: 6px; }
  .brand .tag {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }
  h1 {
    font-size: clamp(28px, 5vw, 38px);
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .subhead {
    color: var(--ink-soft);
    font-size: 14px;
    max-width: 46ch;
    line-height: 1.55;
    margin: 2px 0 0;
  }
  .meta-box {
    font-family: 'IBM Plex Mono', monospace;

    color: var(--ink-faint);
    text-align: right;

    white-space: nowrap;
  }

  nav.tabs {

  section.panel { display: none; padding-top: 24px; }
  section.panel.active { display: block; }

  .layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; }

  .card {
    background: var(--surface);

    border-radius: var(--radius-md);
    box-shadow: var(--shadow);
  }
  .card-head {
    padding: 12px 16px;

  .card-head .label {

  textarea, input[type="text"], input[type="number"] {

<div class="toast" id="toast"></div>

<script>
  // ---------- tab switching ----------
  var tabButtons = document.querySelectorAll('nav.tabs button');
  var panels = document.querySelectorAll('section.panel');
  tabButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      tabButtons.forEach(function (b) { b.classList.remove('active'); });
      panels.forEach(function (p) { p.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.panel).classList.add('active');
    });
  });

  function showToast(text) {
    var toast = document.getElementById('toast');
    toast.textContent = text;
    toast.classList.add('show');
    setTimeout(function () { toast.classList.remove('show'); }, 1400);
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---------- naming linter (ported from the Figma plugin's code.js) ----------
  var sampleNames = [
    'Button/Text',
    'button/large',
    'button/small ',
    'btns/left',
    'btn/right',
    'Button/Icon/Normal',
    'Textinput/Resource/Textfield/Button',
    'Pagination/Resource/Navigation/Button'
  ];
  document.getElementById('naming-input').value = sampleNames.join('\n');

  function lintNamesFromLines(lines) {
    var issues = [];
    var lowerFirstSegmentMap = {};

    lines.forEach(function (name) {
      if (!name) return;

      if (name !== name.trim()) {
        issues.push({ rule: 'whitespace', message: '이름 앞뒤 공백: "' + name + '"' });
      }
      if (/\/\//.test(name) || /\/$/.test(name.trim())) {
        issues.push({ rule: 'slash', message: '연속되거나 끝에 남은 슬래시: "' + name + '"' });
      }

      var trimmed = name.trim();
      var segments = trimmed.split('/').filter(Boolean);
      if (segments.length > 0) {
        var first = segments[0];
        var key = first.toLowerCase();
        if (!lowerFirstSegmentMap[key]) lowerFirstSegmentMap[key] = {};
        lowerFirstSegmentMap[key][first] = (lowerFirstSegmentMap[key][first] || 0) + 1;
      }
    });

    Object.keys(lowerFirstSegmentMap).forEach(function (key) {
      var variants = Object.keys(lowerFirstSegmentMap[key]);
      if (variants.length > 1) {
        var isPluralMismatch = variants.some(function (v) {
          return v.toLowerCase() === key && variants.some(function (o) { return o.toLowerCase() === key + 's'; });
        });
        issues.push({
          rule: isPluralMismatch ? 'plural-mismatch' : 'case-mismatch',
          message: (isPluralMismatch ? '단수/복수 혼용 감지: ' : '대소문자 혼용 감지: ') +
            variants.map(function (v) { return '"' + v + '"'; }).join(', ') + ' 가 같은 그룹으로 보입니다'
        });
      }
    });

    return { scannedCount: lines.filter(Boolean).length, issues: issues };
  }

  document.getElementById('btn-lint').addEventListener('click', function () {
    var lines = document.getElementById('naming-input').value.split('\n');
    var result = lintNamesFromLines(lines);
    var out = document.getElementById('naming-output');

    var summaryHtml = '<div class="result-summary">' +
      '<span class="n ' + (result.issues.length === 0 ? 'zero' : 'some') + '">' + result.issues.length + '</span>' +
      '<span class="label2">건 발견 · ' + result.scannedCount + '개 이름 검사함</span></div>';

    if (result.issues.length === 0) {
      out.innerHTML = summaryHtml + '<div class="ok-line">✓ 컨벤션 문제 없음</div>';
      return;
    }

    var listHtml = result.issues.map(function (issue) {
      return '<div class="issue"><span class="badge ' + issue.rule + '">' + issue.rule + '</span>' +
        '<span class="msg">' + escapeHtml(issue.message) + '</span></div>';
    }).join('');

    out.innerHTML = summaryHtml + listHtml;
  });

  // ---------- contrast checker ----------
  function hexToRgb01(hex) {
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(function (c) { return c + c; }).join('');
    var r = parseInt(hex.substring(0, 2), 16) / 255;
    var g = parseInt(hex.substring(2, 4), 16) / 255;
    var b = parseInt(hex.substring(4, 6), 16) / 255;
    return { r: r, g: g, b: b };
  }
  function relLuminance(c) {
    function channel(v) { return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
    return 0.2126 * channel(c.r) + 0.7152 * channel(c.g) + 0.0722 * channel(c.b);
  }
  function contrastRatio(a, b) {
    var la = relLuminance(a), lb = relLuminance(b);
    var lighter = Math.max(la, lb), darker = Math.min(la, lb);
    return (lighter + 0.05) / (darker + 0.05);
  }

  var colorAHex = document.getElementById('color-a-hex');
  var colorAPick = document.getElementById('color-a-pick');
  var colorBHex = document.getElementById('color-b-hex');
  var colorBPick = document.getElementById('color-b-pick');

  colorAHex.value = '#18A0FB';
  colorAPick.value = '#18A0FB';
  colorBHex.value = '#FFFFFF';
  colorBPick.value = '#FFFFFF';

  colorAPick.addEventListener('input', function () { colorAHex.value = colorAPick.value.toUpperCase(); });
  colorBPick.addEventListener('input', function () { colorBHex.value = colorBPick.value.toUpperCase(); });
  colorAHex.addEventListener('input', function () { if (/^#[0-9a-fA-F]{6}$/.test(colorAHex.value)) colorAPick.value = colorAHex.value; });
  colorBHex.addEventListener('input', function () { if (/^#[0-9a-fA-F]{6}$/.test(colorBHex.value)) colorBPick.value = colorBHex.value; });

  document.getElementById('btn-contrast').addEventListener('click', function () {
    var out = document.getElementById('contrast-output');
    var hexA = colorAHex.value.trim();
    var hexB = colorBHex.value.trim();
    if (!/^#[0-9a-fA-F]{6}$/.test(hexA) || !/^#[0-9a-fA-F]{6}$/.test(hexB)) {
      out.innerHTML = '<p style="color:var(--fail);font-size:13px;">HEX 코드 형식을 확인해주세요 (예: #18A0FB)</p>';
      return;
    }
    var ratio = contrastRatio(hexToRgb01(hexA), hexToRgb01(hexB));
    var rounded = Math.round(ratio * 100) / 100;
    var aa = ratio >= 4.5, aaLarge = ratio >= 3, aaa = ratio >= 7, aaaLarge = ratio >= 4.5;

    out.innerHTML =
      '<div class="swatch-row">' +
        '<div class="swatch"><div class="chip" style="background:' + hexA + '"></div><div class="info">' + hexA + '</div></div>' +
        '<div class="swatch"><div class="chip" style="background:' + hexB + '"></div><div class="info">' + hexB + '</div></div>' +
      '</div>' +
      '<div class="ratio-box">' +
        '<div class="big ' + (aa ? 'pass' : 'fail') + '">' + rounded + ':1</div>' +
        '<div class="sub">명도 대비 비율</div>' +
      '</div>' +
      '<div class="badge-grid">' +
        '<div class="wcag-badge ' + (aa ? 'pass' : 'fail') + '"><span>AA 일반 텍스트</span><span class="icon">' + (aa ? '✓' : '✕') + '</span></div>' +
        '<div class="wcag-badge ' + (aaLarge ? 'pass' : 'fail') + '"><span>AA 큰 텍스트/UI</span><span class="icon">' + (aaLarge ? '✓' : '✕') + '</span></div>' +
        '<div class="wcag-badge ' + (aaa ? 'pass' : 'fail') + '"><span>AAA 일반 텍스트</span><span class="icon">' + (aaa ? '✓' : '✕') + '</span></div>' +
        '<div class="wcag-badge ' + (aaaLarge ? 'pass' : 'fail') + '"><span>AAA 큰 텍스트</span><span class="icon">' + (aaaLarge ? '✓' : '✕') + '</span></div>' +
      '</div>';
  });
  document.getElementById('btn-contrast').click();

  // ---------- CSS exporter ----------
  document.getElementById('css-name').value = 'primary-button';
  document.getElementById('css-bg').value = '#18A0FB';
  document.getElementById('css-font').value = 'Pretendard';
  document.getElementById('css-fontsize').value = '15';
  document.getElementById('css-lineheight').value = '22';
  document.getElementById('css-letterspacing').value = '-0.2';
  document.getElementById('css-gap').value = '8';
  document.getElementById('css-radius').value = '8';
  document.getElementById('css-padding').value = '12 20 12 20';

  function buildCss() {
    var name = (document.getElementById('css-name').value.trim() || 'layer')
      .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'layer';
    var bg = document.getElementById('css-bg').value.trim();
    var font = document.getElementById('css-font').value.trim();
    var fontSize = document.getElementById('css-fontsize').value.trim();
    var lineHeight = document.getElementById('css-lineheight').value.trim();
    var letterSpacing = document.getElementById('css-letterspacing').value.trim();
    var gap = document.getElementById('css-gap').value.trim();
    var radius = document.getElementById('css-radius').value.trim();
    var padding = document.getElementById('css-padding').value.trim().split(/\s+/).filter(Boolean);

    var lines = [];
    if (bg) lines.push('  background-color: ' + bg + ';');
    if (font) lines.push('  font-family: "' + font + '";');
    if (fontSize) lines.push('  font-size: ' + fontSize + 'px;');
    if (lineHeight) lines.push('  line-height: ' + lineHeight + 'px;');
    if (letterSpacing && Number(letterSpacing) !== 0) lines.push('  letter-spacing: ' + letterSpacing + 'px;');
    if (gap) lines.push('  gap: ' + gap + 'px;');
    if (padding.length === 4) lines.push('  padding: ' + padding.map(function (p) { return p + 'px'; }).join(' ') + ';');
    if (radius) lines.push('  border-radius: ' + radius + 'px;');

    return '.' + name + ' {\n' + lines.join('\n') + '\n}';
  }

  function renderCss() {
    document.getElementById('css-output').textContent = buildCss();
  }
  document.getElementById('btn-css').addEventListener('click', renderCss);
  renderCss();

  document.getElementById('btn-copy-css').addEventListener('click', function () {
    var text = document.getElementById('css-output').textContent;
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('복사됨!');
    } catch (e) {
      showToast('복사에 실패했어요');
    }
  });
</script>
